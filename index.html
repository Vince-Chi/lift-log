<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lift Log</title>
<meta name="theme-color" content="#0b0f17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lift Log" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root {
    --bg: #0b0f17;
    --surface: #141a24;
    --surface-2: #1c2330;
    --surface-3: #232c3b;
    --border: #262f3f;
    --text: #e8ecf1;
    --text-dim: #9aa5b4;
    --text-mute: #6b7686;
    --accent: #34d399;
    --accent-dim: #1f7a5c;
    --accent-ink: #06231a;
    --gold: #fbbf24;
    --warn: #f59e0b;
    --danger: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    padding-top: env(safe-area-inset-top);
    overscroll-behavior-y: none;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.topbar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(11,15,23,0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  header.topbar h1 { font-size: 19px; margin: 0; font-weight: 700; flex: 1; letter-spacing: -0.2px; }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .sync-pill {
    display: none; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600;
  }
  .sync-pill.show { display: inline-flex; }
  .sync-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); }
  .sync-pill[data-s="idle"] .dot { background: var(--accent); }
  .sync-pill[data-s="syncing"] .dot, .sync-pill[data-s="pending"] .dot { background: var(--gold); }
  .sync-pill[data-s="error"] .dot { background: var(--danger); }

  main { flex: 1; padding: 12px 16px calc(150px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card h3 { font-size: 13px; margin: 0 0 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }
  .eyebrow { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .banner { border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.4; }
  .banner.ramp { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35); color: #fde68a; }
  .banner.info { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.3); color: #a7f3d0; }

  label.lbl { display: block; font-size: 12px; color: var(--text-dim); margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  input, select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px; font-size: 16px; outline: none; font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 650; min-height: 48px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,0.35); }
  .btn-sm { padding: 8px 12px; min-height: 36px; font-size: 14px; border-radius: 10px; }
  .btn-block { width: 100%; }
  .stack > * + * { margin-top: 10px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600;
  }
  .chip.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px; padding: 10px; font-weight: 600; }
  .seg button.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

  /* plan preview */
  .ex-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ex-line:last-child { border-bottom: none; }
  .ex-line .n { font-weight: 600; flex-shrink: 0; max-width: 60%; }
  .ex-line .t { color: var(--text-dim); font-size: 14px; text-align: right; min-width: 0; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; background: var(--surface-3); color: var(--text-dim); }
  .tag.main { background: rgba(52,211,153,0.15); color: var(--accent); }

  /* active workout */
  .ex-card { padding: 14px 14px 10px; }
  .ex-head { display: flex; align-items: flex-start; gap: 10px; }
  .ex-head .grow { flex: 1; min-width: 0; }
  .ex-title { font-weight: 700; font-size: 17px; }
  .ex-sub { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .ex-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--text-dim); margin: 8px 0 4px; }
  .ex-meta b { color: var(--text); font-weight: 600; }
  .hint { font-size: 13px; background: rgba(251,191,36,0.08); border: 1px dashed rgba(251,191,36,0.4); color: #fde68a; border-radius: 10px; padding: 8px 10px; margin: 8px 0 4px; line-height: 1.4; }
  .set-grid { margin-top: 6px; }
  .set-row { display: grid; grid-template-columns: 34px 1fr 18px 1fr 52px; gap: 8px; align-items: center; padding: 5px 0; }
  .set-row .sl { font-size: 13px; font-weight: 700; color: var(--text-dim); text-align: center; }
  .set-row.warm .sl { color: var(--text-mute); font-size: 11px; }
  .set-row .x { color: var(--text-mute); text-align: center; font-size: 13px; }
  .set-row input { padding: 10px 8px; text-align: center; font-weight: 600; font-size: 17px; }
  .set-row.warm input { font-size: 15px; color: var(--text-dim); }
  .set-row.done input { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.35); }
  .check {
    width: 52px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-mute);
  }
  .set-row.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pr-badge { color: var(--gold); font-size: 11px; font-weight: 800; }
  .ex-actions { display: flex; gap: 8px; margin-top: 8px; }
  .col-head { display: grid; grid-template-columns: 34px 1fr 18px 1fr 52px; gap: 8px; font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; margin-top: 8px; }

  /* rest timer */
  .timer {
    position: fixed; left: 0; right: 0; z-index: 6;
    bottom: calc(60px + env(safe-area-inset-bottom));
    display: none; padding: 0 12px 8px;
  }
  .timer.show { display: block; }
  .timer .inner {
    max-width: 536px; margin: 0 auto; background: var(--surface-3); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative; overflow: hidden;
  }
  .timer .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  .timer .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 72px; }
  .timer .lbl2 { flex: 1; font-size: 12px; color: var(--text-dim); }
  .timer.done .inner { background: var(--accent-dim); }

  /* tab bar */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    background: rgba(20,26,36,0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar .tab { flex: 1; padding: 9px 0 8px; color: var(--text-dim); font-size: 11px; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600; }
  nav.tabbar .tab svg { width: 22px; height: 22px; }
  nav.tabbar .tab.active { color: var(--accent); }

  /* sheets */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; z-index: 20; }
  .sheet {
    background: var(--surface); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 560px; margin: 0 auto;
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .sheet .section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .pick-row { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; border-bottom: 1px solid var(--border); padding: 13px 2px; text-align: left; }
  .pick-row .muted { font-size: 12px; }

  /* onboarding */
  .onboard { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
  .onboard .wrap { max-width: 480px; margin: 0 auto; }
  .onboard h1 { font-size: 26px; margin: 8px 0 6px; letter-spacing: -0.3px; }
  .onboard p.lead { color: var(--text-dim); margin: 0 0 18px; line-height: 1.45; }
  .steps { display: flex; gap: 6px; margin-bottom: 16px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
  .steps i.on { background: var(--accent); }
  .lift-in { display: grid; grid-template-columns: 1fr 86px 64px; gap: 8px; align-items: end; margin-bottom: 4px; }
  .notsure { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin: 4px 0 14px; }
  .notsure input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* progress */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; }
  .tile .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; font-weight: 600; }
  .cal { display: grid; grid-template-columns: 26px repeat(12, 1fr); gap: 4px; align-items: center; }
  .cal .d { aspect-ratio: 1; border-radius: 4px; background: var(--surface-3); }
  .cal .d.on { background: var(--accent); }
  .cal .d.future { background: transparent; border: 1px dashed var(--border); }
  .cal .rl { font-size: 10px; color: var(--text-mute); }
  .cal .wk-ok { height: 4px; border-radius: 2px; background: var(--accent-dim); }
  .cal .wk-no { height: 4px; border-radius: 2px; background: transparent; }

  .chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .ch-wrap { position: relative; }
  .ch-grid { stroke: var(--border); stroke-width: 1; }
  .ch-axis { fill: var(--text-mute); font-size: 10px; }
  .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ch-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .ch-dot-last { r: 4.5; }
  .ch-hover { fill: var(--text); stroke: var(--surface); stroke-width: 2; }
  .ch-cross { stroke: var(--text-mute); stroke-width: 1; stroke-dasharray: 3 3; }
  .ch-bar { fill: var(--accent); transition: opacity 0.1s; }
  .ch-bar.dim { opacity: 0.4; }
  .ch-tip {
    position: absolute; top: -6px; transform: translate(-50%, -100%); pointer-events: none;
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px;
    font-size: 12px; white-space: nowrap; display: flex; flex-direction: column; gap: 1px;
  }
  .ch-tip span { color: var(--text-dim); font-size: 11px; }
  .pr-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pr-table td { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .pr-table tr:last-child td { border-bottom: none; }
  .pr-table td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .pr-table .sub { font-size: 12px; color: var(--text-dim); }

  .hist-card { display: block; width: 100%; text-align: left; }
  .hist-card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .hist-card .ttl { font-weight: 700; font-size: 16px; }

  .empty { text-align: center; color: var(--text-dim); padding: 36px 16px; font-size: 14px; }
  .empty.small { padding: 24px 8px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top));
    background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
    padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.pr { background: #3b2f0b; border-color: var(--gold); color: #fde68a; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="pageTitle">Today</h1>
    <button class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncText"></span></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>
  <main>
    <section id="view-today" class="view active"></section>
    <section id="view-progress" class="view"></section>
    <section id="view-history" class="view"></section>
  </main>
  <div class="timer" id="timer">
    <div class="inner">
      <div class="time" id="timerTime">0:00</div>
      <div class="lbl2" id="timerLabel">Rest</div>
      <button class="btn btn-ghost btn-sm" id="timerMinus">−15</button>
      <button class="btn btn-ghost btn-sm" id="timerPlus">+15</button>
      <button class="btn btn-ghost btn-sm" id="timerSkip">Skip</button>
      <div class="bar" id="timerBar"></div>
    </div>
  </div>
  <nav class="tabbar">
    <button class="tab active" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Today</button>
    <button class="tab" data-view="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Progress</button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
